spring.application.name=camplana
server.port=8080

# Ativa o perfil dev
spring.profiles.active=dev

# Configurações de Upload
spring.servlet.multipart.enabled=true
spring.servlet.multipart.max-file-size=25MB
spring.servlet.multipart.max-request-size=300MB

spring.docker.compose.enabled=false

# Configuração do gRPC com suporte a .env e fallback
grpc.client.iaService.address=static://${GRPC_LANA_HOST:host.docker.internal}:${GRPC_LANA_PORT:50051}
grpc.client.iaService.negotiation-type=plaintext