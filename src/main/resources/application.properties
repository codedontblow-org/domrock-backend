# App geral
spring.application.name=camplana
server.port=8080

# Conexão DB (em prod vem do .env via docker-compose)
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

# Flyway
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration

# Senha do papel somente leitura da Lana
spring.flyway.placeholders.lana_db_password=${LANA_DB_PASSWORD}

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false

# Chave secreta JWT (em prod vem do .env via docker-compose)
api.security.token.secret=${JWT_SECRET}

# Upload
spring.servlet.multipart.enabled=true
spring.servlet.multipart.max-file-size=25MB
spring.servlet.multipart.max-request-size=300MB

# Lana (agente de IA). No compose da raiz: http://lana:8000
lana.url=${LANA_URL}

# Gerar e executar o código da regra leva de 10 s a 1 min com a LLM e uma nova tentativa.
spring.http.clients.connect-timeout=5s
spring.http.clients.read-timeout=3m

# O HttpClient do JDK (padrão) tenta upgrade h2c em http://; o uvicorn da Lana descarta o corpo.
spring.http.clients.imperative.factory=simple