# Conexão com o Banco de Dados (Dev)
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration

# JPA / Hibernate (Dev)
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=true
spring.jpa.open-in-view=false

# Configuração do gRPC com suporte a .env e fallback
grpc.client.iaService.address=static://${GRPC_LANA_HOST:host.docker.internal}:${GRPC_LANA_PORT:50051}
grpc.client.iaService.negotiation-type=plaintext