# SÓ PARA RODAR LOCAL COM O PROFILE dev (IntelliJ). NUNCA ativar em produção.

# Conexão DB local
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/camplana}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:postgres}

# Senha do papel somente leitura da Lana (V3)
spring.flyway.placeholders.lana_db_password=${LANA_DB_PASSWORD:lana_leitura}

# Segredo de dev, público e descartável
api.security.token.secret=${JWT_SECRET:segredo-so-para-dev-nao-usar-em-producao-123456}

# Lana (agente de IA). No compose da raiz: http://lana:8000
lana.url=${LANA_URL:http://localhost:8000}

# Mostrar SQL no console
spring.jpa.show-sql=true