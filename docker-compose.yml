services:
  postgres:
    image: postgres:16
    container_name: postgres-camplana
    environment:
      POSTGRES_DB: camplana
      POSTGRES_USER: ${DB_USERNAME:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-postgres}
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  app:
    build: .
    container_name: camplana-app
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      # Dentro da rede do compose o host do banco e o nome do servico, nao localhost
      DB_URL: jdbc:postgresql://postgres:5432/camplana
      DB_USERNAME: ${DB_USERNAME:-postgres}
      DB_PASSWORD: ${DB_PASSWORD:-postgres}
    ports:
      - "8080:8080"
    restart: unless-stopped

volumes:
  postgres-data:
