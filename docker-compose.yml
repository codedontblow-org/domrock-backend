#DB SQL
services:
  postgres:
    image: postgres:16
    container_name: postgres-camplana
    environment:
      POSTGRES_DB: camplana
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data

volumes:
  postgres-data: